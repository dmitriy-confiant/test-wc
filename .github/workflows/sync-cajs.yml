name: Sync cajs changes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "cef_client/cajs/cajs.js"
      - "cef_client/cajs/patch_js_objects.js"
  push:
    branches:
      - main
    paths:
      - "cef_client/cajs/cajs.js"
      - "cef_client/cajs/patch_js_objects.js"

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      id-token: write
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v37
        with:
          files: |
            cef_client/cajs/cajs.js
            cef_client/cajs/patch_js_objects.js

      - name: Prepare file data
        if: steps.changed-files.outputs.any_changed == 'true'
        id: prepare-data
        run: |
          CHANGED_FILES=$(echo '${{ steps.changed-files.outputs.all_changed_files }}' | jq -R -s -c 'split("\n")[:-1]')
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

          FILE_DATA="{"
          for file in $(echo $CHANGED_FILES | jq -r '.[]'); do
            if [ -f "$file" ]; then
              CONTENT=$(base64 -w 0 "$file")
              FILENAME=$(basename "$file")
              if [ "$FILE_DATA" != "{" ]; then
                FILE_DATA="$FILE_DATA,"
              fi
              FILE_DATA="$FILE_DATA\"$FILENAME\":\"$CONTENT\""
            fi
          done
          FILE_DATA="$FILE_DATA}"

          echo "file_data<<EOF" >> $GITHUB_OUTPUT
          echo "$FILE_DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "source_type=pr" >> $GITHUB_OUTPUT
            echo "source_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "source_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            echo "source_branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "source_type=push" >> $GITHUB_OUTPUT
            echo "source_number=0" >> $GITHUB_OUTPUT
            echo "source_title=Sync JS files from main branch" >> $GITHUB_OUTPUT
            echo "source_branch=main" >> $GITHUB_OUTPUT
          fi

      - name: Trigger sync in puppet-master
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: dmitriy-confiant/test-pm
          event-type: sync-from-workerclient
          client-payload: |
            {
              "source_type": "${{ steps.prepare-data.outputs.source_type }}",
              "source_number": "${{ steps.prepare-data.outputs.source_number }}",
              "source_title": "${{ steps.prepare-data.outputs.source_title }}",
              "source_branch": "${{ steps.prepare-data.outputs.source_branch }}",
              "changed_files": ${{ steps.prepare-data.outputs.changed_files }},
              "file_data": ${{ steps.prepare-data.outputs.file_data }}
            }
